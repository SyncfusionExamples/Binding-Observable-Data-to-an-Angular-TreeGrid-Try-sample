<ejs-treegrid
  #treegrid
  [dataSource]="tasks | async"
  hasChildMapping="isParent"
  parentIdMapping="ParentID"
  [height]="300"
  [treeColumnIndex]="1"
  idMapping="id"
  [pageSettings]="pageSettings"
  (dataStateChange)="dataStateChange($event)"
>
  <e-columns>
    <e-column
      field="id"
      headerText="Task ID"
      width="120"
      textAlign="Right"
      isPrimaryKey="true"
      type="number"
    ></e-column>
    <e-column field="TaskName" headerText="Task Name" width="225"></e-column>
    <e-column
      field="Duration"
      headerText="Duration"
      type="number"
      textAlign="Right"
      width="130"
      editType="numericedit"
    ></e-column>
  </e-columns>
</ejs-treegrid>
